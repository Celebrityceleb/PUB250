
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Login | PUB250</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="auth-page admin-login-page">

    <main class="auth-container">

        <div class="auth-brand">
            <div class="auth-brand-icon">P</div>
            <h1>PUB250</h1>
            <p>ADMINISTRATOR PORTAL</p>
        </div>

        <section class="auth-card">

            <div class="auth-heading">
                <span class="auth-eyebrow">SECURE ACCESS</span>
                <h2>Administrator Login</h2>
                <p>Sign in to access your administrative workspace.</p>
            </div>

            <form id="adminLoginForm">

                <div class="form-group">
                    <label for="adminEmail">Administrator Gmail</label>
                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="Enter your Gmail address"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="adminPassword">Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="adminPassword"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                        >
                            Show
                        </button>
                    </div>
                </div>

                <div class="auth-register-link" style="text-align:right; margin: 0 0 15px;">
                    <a href="#" id="forgotPasswordLink">
                        Forgot password?
                    </a>
                </div>

                <div
                    class="auth-message"
                    id="adminLoginMessage"
                    role="alert"
                    aria-live="polite"
                ></div>

                <button
                    type="submit"
                    class="auth-submit"
                    id="adminLoginButton"
                >
                    <span id="adminLoginButtonText">Sign In</span>
                </button>

            </form>

            <div class="auth-divider"></div>

            <div class="auth-register-link">
                <a href="index.html">← Return to homepage</a>
            </div>

        </section>

    </main>

    <footer class="creator-footer auth-creator-footer">
        <div class="creator-footer-brand">
            <span class="creator-footer-line"></span>
            <span>PUB250</span>
            <span class="creator-footer-line"></span>
        </div>

        <p class="creator-footer-label">
            DESIGNED &amp; DEVELOPED BY
        </p>

        <p class="creator-footer-name">
            Celebrity Celeb <span>✝️</span>
        </p>

        <p class="creator-footer-copyright">
            © 2026 PUB250. All rights reserved.
        </p>
    </footer>

    <script type="module">

        import { adminLogin } from "./js/auth.js";
        import { supabase } from "./js/config.js";

        const form = document.getElementById("adminLoginForm");
        const emailInput = document.getElementById("adminEmail");
        const passwordInput = document.getElementById("adminPassword");

        const message = document.getElementById("adminLoginMessage");
        const loginButton = document.getElementById("adminLoginButton");
        const buttonText = document.getElementById("adminLoginButtonText");
        const togglePassword = document.getElementById("togglePassword");
        const forgotPasswordLink = document.getElementById("forgotPasswordLink");

        function showMessage(text, type) {
            message.textContent = text;
            message.className = "auth-message " + type;
            message.style.display = "block";
        }

        togglePassword.addEventListener("click", () => {
            const isHidden = passwordInput.type === "password";

            passwordInput.type = isHidden ? "text" : "password";
            togglePassword.textContent = isHidden ? "Hide" : "Show";
        });

        // Administrator login
        form.addEventListener("submit", async (event) => {

            event.preventDefault();

            message.textContent = "";
            message.className = "auth-message";

            loginButton.disabled = true;
            buttonText.textContent = "Signing in...";

            try {

                await adminLogin(
                    emailInput.value,
                    passwordInput.value
                );

                showMessage(
                    "Login successful. Opening administrator portal...",
                    "success"
                );

                window.location.href = "admin-dashboard.html";

            } catch (error) {

                showMessage(
                    error.message || "Unable to sign in. Please try again.",
                    "error"
                );

                loginButton.disabled = false;
                buttonText.textContent = "Sign In";
            }
        });

        // Administrator password recovery
        forgotPasswordLink.addEventListener("click", async (event) => {

            event.preventDefault();

            const email = emailInput.value.trim().toLowerCase();

            if (!email || !emailInput.checkValidity()) {
                showMessage(
                    "Enter your administrator Gmail address first.",
                    "error"
                );
                emailInput.focus();
                return;
            }

            forgotPasswordLink.style.pointerEvents = "none";
            forgotPasswordLink.textContent = "Sending reset link...";

            try {

                const { error } = await supabase.auth.resetPasswordForEmail(
                    email,
                    {
                        redirectTo:
                            "https://celebrityceleb.github.io/PUB250/update-password.html"
                    }
                );

                if (error) {
                    throw error;
                }

                showMessage(
                    "Password reset instructions have been sent. Check your Gmail inbox.",
                    "success"
                );

            } catch (error) {

                showMessage(
                    error.message || "Unable to send password reset email.",
                    "error"
                );

            } finally {

                forgotPasswordLink.style.pointerEvents = "auto";
                forgotPasswordLink.textContent = "Forgot password?";
            }
        });

    </script>

</body>
</html>
