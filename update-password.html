
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Password | PUB250</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="auth-page">

    <main class="auth-container">

        <div class="auth-brand">
            <div class="auth-brand-icon">P</div>
            <div>
                <h1>PUB250</h1>
                <p>ADMINISTRATOR SECURITY</p>
            </div>
        </div>

        <section class="auth-card">
            <div class="auth-heading">
                <span class="auth-eyebrow">ACCOUNT RECOVERY</span>
                <h2>Set a new password</h2>
                <p>Enter and confirm your new administrator password.</p>
            </div>

            <form id="updatePasswordForm">

                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password"
                        minlength="8"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                        minlength="8"
                        required
                    >
                </div>

                <div id="passwordMessage" class="auth-message"></div>

                <button type="submit" class="auth-submit" id="updatePasswordButton">
                    <span id="updatePasswordButtonText">Update Password</span>
                </button>

            </form>
        </section>

        <footer class="creator-footer auth-creator-footer">
            <div class="creator-footer-brand">
                <span class="creator-footer-line"></span>
                <span>PUB250</span>
                <span class="creator-footer-line"></span>
            </div>

            <p class="creator-footer-label">DESIGNED &amp; DEVELOPED BY</p>
            <p class="creator-footer-name">
                Celebrity Celeb <span>✝️</span>
            </p>
            <p class="creator-footer-copyright">
                © 2026 PUB250. All rights reserved.
            </p>
        </footer>

    </main>

    <script type="module">
        import { supabase } from "./js/config.js";

        const form = document.getElementById("updatePasswordForm");
        const message = document.getElementById("passwordMessage");
        const button = document.getElementById("updatePasswordButton");
        const buttonText = document.getElementById("updatePasswordButtonText");

        function showMessage(text, type) {
            message.textContent = text;
            message.className = `auth-message ${type}`;
            message.style.display = "block";
        }

        async function checkRecoverySession() {
            const { data, error } = await supabase.auth.getSession();

            if (error || !data.session) {
                showMessage(
                    "This recovery link is invalid or has expired. Request a new password reset link.",
                    "error"
                );
                form.style.display = "none";
                return false;
            }

            return true;
        }

        const recoveryReady = await checkRecoverySession();

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            if (!recoveryReady) return;

            const password = document.getElementById("newPassword").value;
            const confirmation = document.getElementById("confirmPassword").value;

            if (password.length < 8) {
                showMessage("Password must contain at least 8 characters.", "error");
                return;
            }

            if (password !== confirmation) {
                showMessage("The passwords do not match.", "error");
                return;
            }

            button.disabled = true;
            buttonText.textContent = "Updating...";

            const { error } = await supabase.auth.updateUser({
                password: password
            });

            if (error) {
                showMessage(error.message, "error");
                button.disabled = false;
                buttonText.textContent = "Update Password";
                return;
            }

            showMessage(
                "Your password has been updated successfully. You can now log in.",
                "success"
            );

            form.style.display = "none";

            await supabase.auth.signOut();

            setTimeout(() => {
                window.location.href = "admin.html";
            }, 2500);
        });
    </script>

</body>
  </html>
