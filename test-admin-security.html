<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Test</title>
</head>
<body>
    <h2>Admin Management Security Test</h2>
    <button id="testButton">Test Student Access</button>
    <pre id="result">Waiting...</pre>

    <script type="module">
        import { supabase } from "./js/config.js";

        const button = document.getElementById("testButton");
        const result = document.getElementById("result");

        button.addEventListener("click", async () => {
            button.disabled = true;
            result.textContent = "Testing...";

            const { data, error } = await supabase.functions.invoke(
                "admin-management",
                {
                    body: {
                        action: "invite",
                        full_name: "Security Test",
                        email: "test@example.com",
                        role: "student",
                        matric_no: "TEST001",
                        phone: "08000000000"
                    }
                }
            );

            let details = {
    response: data,
    error: error?.message || null,
    status: error?.context?.status || null
};

if (error?.context) {
    try {
        const response = await error.context.clone().text();
        details.serverResponse = response
            ? JSON.parse(response)
            : "Empty response";
    } catch {
        details.serverResponse = "Could not read server response.";
    }
}

result.textContent = JSON.stringify(details, null, 2);

            button.disabled = false;
        });
    </script>
</body>
</html>
