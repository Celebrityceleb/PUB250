
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Security Test</title>
</head>
<body>

    <h2>Super Admin Security Test</h2>
    <button id="testButton">Verify Super Admin Access</button>
    <pre id="result">Waiting...</pre>

    <script type="module">
        import { supabase } from "./js/config.js";

        const button = document.getElementById("testButton");
        const result = document.getElementById("result");

        button.addEventListener("click", async () => {
            button.disabled = true;
            result.textContent = "Checking...";

            try {
                const { data: { session }, error: sessionError } =
                    await supabase.auth.getSession();

                if (sessionError || !session) {
                    throw new Error("No active login session found.");
                }

                const { data, error } =
                    await supabase.functions.invoke(
                        "admin-management",
                        {
                            body: {
                                action: "security_test"
                            }
                        }
                    );

                if (error) {
                    let serverMessage = error.message;

                    if (error.context) {
                        try {
                            const response = await error.context.clone().json();
                            serverMessage = response.error || serverMessage;
                        } catch {}
                    }

                    result.textContent =
                        "HTTP STATUS: " +
                        (error.context?.status || "Unknown") +
                        "\nSERVER RESPONSE: " + serverMessage;

                    return;
                }

                result.textContent = JSON.stringify(data, null, 2);

            } catch (error) {
                result.textContent = error.message;
            } finally {
                button.disabled = false;
            }
        });
    </script>

</body>
</html>
