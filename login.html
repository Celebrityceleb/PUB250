
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101E35">
    <title>Student Login | PUB250</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

    <main class="auth-container">

        <a href="index.html" class="auth-brand">
            <span class="auth-brand-icon">P</span>
            <span>
                <strong>PUB250</strong>
                <small>PUBLIC ADMINISTRATION</small>
            </span>
        </a>

        <section class="auth-card">

            <div class="auth-heading">
                <span class="auth-eyebrow">STUDENT PORTAL</span>
                <h1>Welcome back</h1>
                <p>Sign in to access your academic resources.</p>
            </div>

            <form id="studentLoginForm">

                <div class="form-group">
                    <label for="matricNo">Matriculation Number</label>
                    <input
                        type="text"
                        id="matricNo"
                        name="matric_no"
                        placeholder="Enter your matric number"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="accessCode">Student Access Code</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="accessCode"
                            name="access_code"
                            placeholder="XXXX-XXXX-XXXX"
                            autocomplete="off"
                            maxlength="14"
                            required
                        >

                        <button
                            type="button"
                            id="toggleCode"
                            class="password-toggle"
                        >
                            Show
                        </button>
                    </div>

                    <small class="field-hint">
                        Enter the access code sent to you by your administrator.
                    </small>
                </div>

                <div id="loginMessage" class="auth-message" role="alert"></div>

                <button
                    type="submit"
                    id="loginButton"
                    class="auth-submit"
                >
                    <span id="loginButtonText">Sign In</span>
                </button>

            </form>

            <div class="auth-divider">
                <span></span>
                <small>NEW TO PUB250?</small>
                <span></span>
            </div>

            <a href="register.html" class="auth-register-link">
                Request Student Access
            </a>

        </section>

        <footer class="creator-footer auth-creator-footer">
    <div class="creator-footer-brand">
        <span class="creator-footer-line"></span>
        <span>PUB250</span>
        <span class="creator-footer-line"></span>
    </div>

    <p class="creator-footer-label">
        DESIGNED &amp; DEVELOPED BY
    </p>

    <p class="creator-footer-name">
        Celebrity Celeb <span>✝️</span>
    </p>

    <p class="creator-footer-copyright">
        © 2026 PUB250. All rights reserved.
    </p>
        </footer>

    </main>

    <script type="module">
        import { studentLogin } from "./js/auth.js";

        const form = document.getElementById("studentLoginForm");
        const matricInput = document.getElementById("matricNo");
        const codeInput = document.getElementById("accessCode");
        const message = document.getElementById("loginMessage");
        const loginButton = document.getElementById("loginButton");
        const buttonText = document.getElementById("loginButtonText");
        const toggleCode = document.getElementById("toggleCode");

        toggleCode.addEventListener("click", () => {
            const hidden = codeInput.type === "password";

            codeInput.type = hidden ? "text" : "password";
            toggleCode.textContent = hidden ? "Hide" : "Show";
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            message.textContent = "";
            message.className = "auth-message";

            loginButton.disabled = true;
            buttonText.textContent = "Signing in...";

            try {
                const profile = await studentLogin(
                    matricInput.value,
                    codeInput.value
                );

                message.textContent = `Welcome, ${profile.full_name}.`;
                message.className = "auth-message success";

                buttonText.textContent = "Login successful";

                window.location.href = "student.html";

            } catch (error) {
                message.textContent = error.message;
                message.className = "auth-message error";

                loginButton.disabled = false;
                buttonText.textContent = "Sign In";
            }
        });
    </script>

</body>
</html>
